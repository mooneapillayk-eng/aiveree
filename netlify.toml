[build]
  command="npm run build"
  publish="dist"
  functions="netlify/functions"
[functions]
  node_bundler="esbuild"
[functions."rank-tools"]
  schedule="0 0 * * *"
[[redirects]]
  from="/*"
  to="/index.html"
  status=200
[[headers]]
  for="/assets/*"
  [headers.values]
    Cache-Control="public, max-age=31536000, immutable"
