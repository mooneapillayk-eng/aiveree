[build]
  command="npm run build"
  publish="dist"
  functions="netlify/functions"
[functions]
  node_bundler="esbuild"
  included_files=["netlify/functions/**"]
[functions."data-ingest"]
  schedule="0 6 * * 1"
  timeout=30
[functions."digest"]
  schedule="0 8 * * *"
  timeout=30
[functions."agent"]
  timeout=26
[functions."memory"]
  timeout=20
[functions."events"]
  timeout=10
[functions."approvals"]
  timeout=10
[functions."elevenlabs-tts"]
  timeout=15
[[redirects]]
  from="/*"
  to="/index.html"
  status=200
[[headers]]
  for="/assets/*"
  [headers.values]
    Cache-Control="public, max-age=31536000, immutable"
